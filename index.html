<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b7285">
<title>AquaControl</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:#eef7f8;
 color:#17323a;
}
header{
 background:linear-gradient(135deg,#087f8c,#0b7285);
 color:white;
 padding:25px 20px 30px;
 border-radius:0 0 25px 25px;
}
header h1{margin:0;font-size:30px}
header p{margin:6px 0 0;opacity:.85}
.container{padding:18px;max-width:700px;margin:auto}
.card{
 background:white;
 border-radius:18px;
 padding:18px;
 margin-bottom:15px;
 box-shadow:0 4px 15px #00000012;
}
.card h2{margin-top:0;font-size:20px}
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}
.stat{
 background:#e9f7f8;
 padding:15px;
 border-radius:14px;
}
.stat strong{display:block;font-size:24px;color:#087f8c}
label{
 display:block;
 font-weight:600;
 margin:12px 0 6px;
}
input,select,textarea{
 width:100%;
 padding:12px;
 border:1px solid #ccdfe2;
 border-radius:10px;
 font-size:16px;
 background:white;
}
button{
 border:0;
 border-radius:12px;
 padding:13px 18px;
 font-size:16px;
 font-weight:600;
 background:#087f8c;
 color:white;
 margin-top:12px;
}
button.secondary{background:#d9eef0;color:#075b65}
button.danger{background:#d9534f}
.row{
 display:flex;
 gap:8px;
 align-items:center;
 justify-content:space-between;
}
.item{
 border:1px solid #e0ecee;
 border-radius:12px;
 padding:12px;
 margin-top:9px;
}
.small{font-size:13px;color:#6b7f84}
.badge{
 display:inline-block;
 padding:5px 9px;
 border-radius:20px;
 background:#d9f2e6;
 color:#176b42;
 font-size:12px;
}
nav{
 position:sticky;
 bottom:0;
 background:white;
 padding:10px;
 display:flex;
 justify-content:space-around;
 box-shadow:0 -3px 15px #0001;
}
nav button{
 background:none;
 color:#087f8c;
 margin:0;
 padding:8px;
 font-size:13px;
}
.hidden{display:none}
</style>
</head>

<body>

<header>
<h1>🐠 AquaControl</h1>
<p>Control y seguimiento de tus acuarios</p>
</header>

<div class="container">

<section id="inicio">

<div class="card">
<h2>📊 Resumen</h2>

<div class="grid">
<div class="stat">
<span>Temperatura</span>
<strong id="tempShow">-- °C</strong>
</div>

<div class="stat">
<span>pH</span>
<strong id="phShow">--</strong>
</div>

<div class="stat">
<span>NO₂</span>
<strong id="no2Show">--</strong>
</div>

<div class="stat">
<span>NO₃</span>
<strong id="no3Show">--</strong>
</div>
</div>
</div>

<div class="card">
<h2>🐟 Mis acuarios</h2>
<div id="aquariums"></div>

<label>Nombre del acuario</label>
<input id="aqName" placeholder="Ej. Amazónico 550 L">

<label>Litros</label>
<input id="aqLiters" type="number" placeholder="550">

<button onclick="addAquarium()">➕ Añadir acuario</button>
</div>

<div class="card">
<h2>💧 Última medición</h2>

<label>Temperatura °C</label>
<input id="temp" type="number" step="0.1">

<label>pH</label>
<input id="ph" type="number" step="0.01">

<label>NO₂ mg/L</label>
<input id="no2" type="number" step="0.01">

<label>NO₃ mg/L</label>
<input id="no3" type="number" step="0.1">

<label>KH</label>
<input id="kh" type="number" step="0.1">

<label>GH</label>
<input id="gh" type="number" step="0.1">

<button onclick="saveWater()">💾 Guardar medición</button>
</div>

</section>


<section id="peces" class="hidden">

<div class="card">
<h2>🐟 Peces</h2>

<label>Especie</label>
<input id="fishName" placeholder="Ej. Neón">

<label>Cantidad</label>
<input id="fishQty" type="number" value="10">

<button onclick="addFish()">➕ Añadir pez</button>

<div id="fishList"></div>
</div>

</section>


<section id="mantenimiento" class="hidden">

<div class="card">
<h2>🔧 Mantenimiento</h2>

<label>Tipo de tarea</label>
<select id="taskType">
<option>Cambio de agua</option>
<option>Limpieza de filtro</option>
<option>Limpieza de cristales</option>
<option>Añadir fertilizante</option>
<option>Añadir CO₂</option>
<option>Otra</option>
</select>

<label>Notas</label>
<textarea id="taskNotes" rows="3"></textarea>

<button onclick="addTask()">✅ Registrar mantenimiento</button>

<div id="taskList"></div>
</div>

</section>


<section id="ajustes" class="hidden">

<div class="card">
<h2>⚙️ Ajustes</h2>

<p class="small">
AquaControl guarda los datos directamente en este dispositivo.
</p>

<button class="danger" onclick="clearData()">
🗑️ Borrar todos los datos
</button>
</div>

</section>

</div>


<nav>
<button onclick="show('inicio')">🏠<br>Inicio</button>
<button onclick="show('peces')">🐟<br>Peces</button>
<button onclick="show('mantenimiento')">🔧<br>Mantenimiento</button>
<button onclick="show('ajustes')">⚙️<br>Ajustes</button>
</nav>


<script>

let data = JSON.parse(localStorage.getItem("aquacontrol")) || {
 aquariums:[],
 fish:[],
 tasks:[],
 water:null
};

function save(){
 localStorage.setItem("aquacontrol",JSON.stringify(data));
}

function show(section){

 document.querySelectorAll("section").forEach(s=>{
   s.classList.add("hidden");
 });

 document.getElementById(section).classList.remove("hidden");

 render();
}

function addAquarium(){

 const name=document.getElementById("aqName").value.trim();
 const liters=document.getElementById("aqLiters").value;

 if(!name || !liters){
   alert("Introduce nombre y litros.");
   return;
 }

 data.aquariums.push({
   name:name,
   liters:Number(liters)
 });

 document.getElementById("aqName").value="";
 document.getElementById("aqLiters").value="";

 save();
 render();
}

function addFish(){

 const name=document.getElementById("fishName").value.trim();
 const qty=document.getElementById("fishQty").value;

 if(!name){
   alert("Introduce la especie.");
   return;
 }

 data.fish.push({
   name:name,
   qty:Number(qty)
 });

 document.getElementById("fishName").value="";

 save();
 render();
}

function addTask(){

 const type=document.getElementById("taskType").value;
 const notes=document.getElementById("taskNotes").value;

 data.tasks.unshift({
   type:type,
   notes:notes,
   date:new Date().toLocaleString("es-ES")
 });

 document.getElementById("taskNotes").value="";

 save();
 render();
}

function saveWater(){

 data.water={
   temp:document.getElementById("temp").value,
   ph:document.getElementById("ph").value,
   no2:document.getElementById("no2").value,
   no3:document.getElementById("no3").value,
   kh:document.getElementById("kh").value,
   gh:document.getElementById("gh").value,
   date:new Date().toLocaleString("es-ES")
 };

 save();
 render();

 alert("Medición guardada correctamente.");
}

function removeFish(i){

 if(confirm("¿Eliminar este pez?")){
   data.fish.splice(i,1);
   save();
   render();
 }
}

function removeAquarium(i){

 if(confirm("¿Eliminar este acuario?")){
   data.aquariums.splice(i,1);
   save();
   render();
 }
}

function render(){

 const aq=document.getElementById("aquariums");

 aq.innerHTML=data.aquariums.length
 ? data.aquariums.map((a,i)=>`
   <div class="item">
   <div class="row">
   <strong>🐠 ${a.name}</strong>
   <span class="badge">${a.liters} L</span>
   </div>
   <button class="danger" onclick="removeAquarium(${i})">Eliminar</button>
   </div>
 `).join("")
 : `<p class="small">Todavía no has añadido ningún acuario.</p>`;


 const fish=document.getElementById("fishList");

 fish.innerHTML=data.fish.length
 ? data.fish.map((f,i)=>`
   <div class="item">
   <div class="row">
   <span>🐟 ${f.name}</span>
   <strong>x${f.qty}</strong>
   </div>
   <button class="danger" onclick="removeFish(${i})">Eliminar</button>
   </div>
 `).join("")
 : `<p class="small">No hay peces registrados.</p>`;


 const tasks=document.getElementById("taskList");

 tasks.innerHTML=data.tasks.length
 ? data.tasks.map(t=>`
   <div class="item">
   <strong>${t.type}</strong>
   <div class="small">${t.date}</div>
   ${t.notes ? `<p>${t.notes}</p>` : ""}
   </div>
 `).join("")
 : `<p class="small">No hay mantenimientos registrados.</p>`;


 if(data.water){

   document.getElementById("tempShow").textContent=
     data.water.temp+" °C";

   document.getElementById("phShow").textContent=
     data.water.ph;

   document.getElementById("no2Show").textContent=
     data.water.no2;

   document.getElementById("no3Show").textContent=
     data.water.no3;

   document.getElementById("temp").value=data.water.temp;
   document.getElementById("ph").value=data.water.ph;
   document.getElementById("no2").value=data.water.no2;
   document.getElementById("no3").value=data.water.no3;
   document.getElementById("kh").value=data.water.kh;
   document.getElementById("gh").value=data.water.gh;

 }
}

function clearData(){

 if(confirm("¿Seguro que quieres borrar todos los datos?")){

   localStorage.removeItem("aquacontrol");

   data={
     aquariums:[],
     fish:[],
     tasks:[],
     water:null
   };

   render();

   alert("Datos borrados.");
 }
}

render();

</script>

</body>
</html>
