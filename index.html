<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e99">
<title>AquaControl</title>
<style>
:root{
--blue:#0b6e99;--blue2:#0d91b8;--light:#eef8fc;--dark:#12313f;
--green:#238b57;--red:#c74b4b;--border:#d7e2e7
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f8fa;color:var(--dark)}
header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;padding:28px 18px 22px;border-radius:0 0 24px 24px}
h1{margin:0 0 6px;font-size:30px}
h2{margin-top:6px}
header p{margin:0;opacity:.9}
nav{display:flex;gap:8px;padding:12px;overflow:auto;background:white;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #0001}
nav button{border:0;background:#edf4f7;color:#31505d;padding:11px 15px;border-radius:20px;white-space:nowrap;font-weight:600}
nav button.active{background:var(--blue);color:white}
main{padding:16px;max-width:950px;margin:auto}
.section{display:none}.section.active{display:block}
.card,.visual-card,.photo-card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0000000d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
input,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;font-size:16px;background:white}
label{display:block;font-weight:600;margin-bottom:5px}
.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--blue);color:white;font-weight:700;cursor:pointer}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat{font-size:24px;font-weight:800}.small{font-size:13px;color:#607782}
.badge{display:inline-block;padding:5px 9px;border-radius:10px;background:var(--light);color:var(--blue);font-size:12px;margin:3px}
.item{border:1px solid #e2eaee;border-radius:15px;padding:14px;background:#fff}
.item h3{margin:0 0 5px}.latin{font-style:italic;color:#607782;font-size:14px}
.empty{text-align:center;color:#70838c;padding:30px}
.good{background:#e8f7ee;color:#17663d;padding:12px;border-radius:12px;font-weight:600}
.material{border:1px solid #dfe8ec;border-radius:14px;padding:14px;margin-top:10px;background:#fafcfd}
.filter-section{border:1px solid #cce5ee;border-radius:14px;padding:14px;margin-top:12px;background:#f8fcfd}
.sump{background:#f1f9fc}
.category-title{margin:18px 0 8px;padding:9px 12px;border-radius:10px;background:#eaf6fa;color:var(--blue);font-size:17px}
.category-total{font-size:12px;font-weight:600;color:#607782;margin-left:6px}
.tank-tabs{display:flex;gap:8px;margin:12px 0 18px;background:#eef8fc;padding:6px;border-radius:14px}
.tank-tab{flex:1;border:0;border-radius:10px;padding:11px 8px;background:transparent;color:#31505d;font-weight:800;font-size:15px}
.tank-tab.active{background:var(--blue);color:#fff}
.tank-pane{display:none}.tank-pane.active{display:block}
.visual-hero{background:linear-gradient(135deg,#0b6e99,#0d91b8);color:#fff;border-radius:18px;padding:20px;margin-bottom:14px}
.visual-hero h2{margin:0 0 6px}
.visual-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:15px}
.visual-stat{background:#ffffff22;border:1px solid #ffffff33;border-radius:12px;padding:10px;text-align:center}
.visual-stat strong{display:block;font-size:19px}.visual-stat span{font-size:11px}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.metric{border-radius:13px;padding:12px;text-align:center;background:#eef8fc}
.metric strong{display:block;font-size:22px;color:var(--blue)}
.metric span{font-size:11px;color:#607782;font-weight:700}
.metric.gh{background:#eaf8ef}.metric.gh strong{color:#238b57}
.metric.kh{background:#fff5e6}.metric.kh strong{color:#c7770e}
.metric.temp{background:#fdeeee}.metric.temp strong{color:#c74b4b}
.visual-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.visual-list{display:flex;flex-wrap:wrap;gap:7px}
.visual-chip{padding:8px 10px;border-radius:11px;background:#f1f8fb;border:1px solid #d8e9ef;font-size:13px;font-weight:700}
.chart-wrap{overflow-x:auto}.chart-svg{width:100%;min-width:330px;height:auto}
.chart-empty{text-align:center;padding:25px;color:#70838c;background:#f7fafb;border-radius:14px}
.photo-box{width:100%;min-height:220px;border:2px dashed #cce5ee;border-radius:14px;background:#f7fbfc;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo-box img{display:block;width:100%;max-height:420px;object-fit:cover}
.photo-placeholder{text-align:center;color:#70838c;padding:35px 15px}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.readonly-note{background:#e8f7ee;color:#17663d;border-radius:12px;padding:10px 12px;font-weight:700}
.measurement{border:1px solid #dfe8ec;border-radius:14px;padding:12px;margin-top:8px;background:#fafcfd}
@media(max-width:520px){
.metric-grid{grid-template-columns:repeat(2,1fr)}
.visual-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<h1>🐠 AquaControl</h1>
<p>Gestión completa de acuarios, filtración, peces y plantas</p>
</header>

<nav>
<button id="navInicio" class="active" onclick="showSection('inicio',this)">Inicio</button>
<button id="navPeces" onclick="showSection('peces',this)">🐟 Peces</button>
<button id="navPlantas" onclick="showSection('plantas',this)">🌿 Plantas</button>
<button id="navAcuarios" onclick="showSection('acuarios',this)">🏠 Mis acuarios</button>
</nav>

<main>

<section id="inicio" class="section active">
<div class="card">
<h2>Mi AquaControl</h2>
<div class="grid">
<div><div class="stat" id="tankCount">0</div><div class="small">acuarios</div></div>
<div><div class="stat" id="fishCount">0</div><div class="small">peces disponibles</div></div>
<div><div class="stat" id="plantCount">0</div><div class="small">plantas disponibles</div></div>
</div>
</div>

<div class="card">
<h2>💾 Guardado automático</h2>
<p>Los acuarios y sus datos se guardan en este dispositivo.</p>
</div>

<div id="homeTanks"></div>
</section>


<section id="peces" class="section">
<h2>🐟 Base de datos de peces</h2>
<div class="card">
<input id="fishSearch" placeholder="🔍 Buscar pez..." oninput="renderFish()">
</div>
<div id="fishList" class="grid"></div>
</section>


<section id="plantas" class="section">
<h2>🌿 Base de datos de plantas</h2>
<div class="card">
<input id="plantSearch" placeholder="🔍 Buscar planta..." oninput="renderPlants()">
</div>
<div id="plantList" class="grid"></div>
</section>


<section id="acuarios" class="section">
<h2>🏠 Mis acuarios</h2>
<div id="tankList"></div>
</section>

</main>

<script>
"use strict";

/* =========================
   BASE DE DATOS
========================= */

const fish=[
["Neón","Paracheirodon innesi","20–26 °C","5,0–7,5","4 cm","80 L","8+"],
["Borrachito","Hemigrammus rhodostomus","24–28 °C","5,0–7,0","5 cm","100 L","8+"],
["Corydoras panda","Corydoras panda","22–26 °C","6,0–7,5","5 cm","80 L","6+"],
["Escalar","Pterophyllum scalare","24–30 °C","6,0–7,5","15 cm","250 L","4+"],
["Ramirezi","Mikrogeophagus ramirezi","26–30 °C","5,0–7,0","6 cm","60 L","Pareja"],
["Ancistrus","Ancistrus sp.","23–28 °C","6,0–7,5","12–15 cm","100 L","1–2"],
["Otocinclus","Otocinclus sp.","22–27 °C","5,5–7,5","4–5 cm","60 L","6+"],
["Guppy","Poecilia reticulata","22–28 °C","6,8–7,8","4–6 cm","60 L","6+"],
["Disco","Symphysodon spp.","27–30 °C","5,5–7,0","15–20 cm","300 L","5+"],
["Betta","Betta splendens","24–30 °C","6,0–8,0","6–7 cm","20 L","1"],
["Platy","Xiphophorus maculatus","22–28 °C","7,0–8,2","5–7 cm","60 L","6+"],
["Molly","Poecilia sphenops","24–28 °C","7,0–8,5","8–12 cm","100 L","6+"],
["Rasbora arlequín","Trigonostigma heteromorpha","23–28 °C","5,0–7,0","4–5 cm","60 L","8+"],
["Tetra cardenal","Paracheirodon axelrodi","23–28 °C","4,5–7,0","4–5 cm","100 L","10+"],
["Cebra danio","Danio rerio","18–26 °C","6,5–8,0","4–5 cm","60 L","8+"],
["Barbo cereza","Puntius titteya","23–27 °C","6,0–8,0","5 cm","60 L","6+"],
["Colisa miel","Trichogaster chuna","24–30 °C","6,0–7,5","5 cm","60 L","1–3"],
["Arcoíris enano","Melanotaenia praecox","23–28 °C","6,5–8,0","6 cm","100 L","6+"]
].map(x=>({name:x[0],latin:x[1],temp:x[2],ph:x[3],size:x[4],min:x[5],group:x[6]}));

const plants=[
["Anubias nana","Anubias barteri var. nana","Baja–media","No necesario","5–15 cm","Primer plano/medio"],
["Microsorum pteropus","Microsorum pteropus","Baja–media","No necesario","15–30 cm","Medio/fondo"],
["Vallisneria","Vallisneria spiralis","Media","Opcional","30–60 cm","Fondo"],
["Echinodorus amazonicus","Echinodorus grisebachii","Media–alta","Recomendado","30–50 cm","Fondo"],
["Cryptocoryne wendtii","Cryptocoryne wendtii","Baja–media","Opcional","10–25 cm","Primer plano/medio"],
["Hygrophila polysperma","Hygrophila polysperma","Media","Opcional","20–50 cm","Fondo"],
["Limnobium laevigatum","Limnobium laevigatum","Media","No necesario","Flotante","Superficie"],
["Bucephalandra","Bucephalandra sp.","Baja–media","Opcional","5–15 cm","Troncos/rocas"],
["Java moss","Taxiphyllum barbieri","Baja–media","Opcional","Variable","Troncos/rocas"],
["Monte Carlo","Micranthemum tweediei","Media–alta","Recomendado","3–5 cm","Primer plano"],
["Rotala rotundifolia","Rotala rotundifolia","Media–alta","Recomendado","20–40 cm","Fondo"],
["Limnophila sessiliflora","Limnophila sessiliflora","Media","Opcional","20–40 cm","Fondo"]
].map(x=>({name:x[0],latin:x[1],light:x[2],co2:x[3],size:x[4],zone:x[5]}));


/* =========================
   DATOS GUARDADOS
========================= */

let tanks=loadTanks();

function loadTanks(){
try{
return JSON.parse(localStorage.getItem("aquacontrol_tanks")||"[]");
}catch(e){return[]}
}

function saveTanks(){
localStorage.setItem("aquacontrol_tanks",JSON.stringify(tanks));
}

function ensureTank(t){
if(!Array.isArray(t.fish))t.fish=[];
if(!Array.isArray(t.plants))t.plants=[];
if(!Array.isArray(t.measurements))t.measurements=[];
if(typeof t.photo!=="string")t.photo="";
if(!t.filter)t.filter={type:"",brand:"",model:"",flow:0,sump:{length:0,width:0,height:0,liters:0},materials:[]};
if(!Array.isArray(t.filter.materials))t.filter.materials=[];
if(!t.filter.sump)t.filter.sump={length:0,width:0,height:0,liters:0};
return t;
}


/* =========================
   NAVEGACIÓN
========================= */

function showSection(id,btn){
document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));
document.getElementById(id).classList.add("active");
document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
if(btn)btn.classList.add("active");

if(id==="peces")renderFish();
if(id==="plantas")renderPlants();
if(id==="acuarios")renderTanks();

window.scrollTo({top:0,behavior:"smooth"});
}


/* =========================
   BASE DE DATOS
========================= */

function renderFish(){
const q=(document.getElementById("fishSearch")?.value||"").toLowerCase();
const r=fish.filter(x=>(x.name+" "+x.latin).toLowerCase().includes(q));
document.getElementById("fishList").innerHTML=r.map(x=>`
<div class="item">
<h3>🐟 ${esc(x.name)}</h3>
<div class="latin">${esc(x.latin)}</div>
<p>
<span class="badge">🌡 ${esc(x.temp)}</span>
<span class="badge">pH ${esc(x.ph)}</span>
<span class="badge">📏 ${esc(x.size)}</span>
</p>
<div class="small">
Mínimo: ${esc(x.min)}<br>
Grupo: ${esc(x.group)}
</div>
</div>`).join("")||'<div class="empty">No se encontraron peces.</div>';
}

function renderPlants(){
const q=(document.getElementById("plantSearch")?.value||"").toLowerCase();
const r=plants.filter(x=>(x.name+" "+x.latin).toLowerCase().includes(q));
document.getElementById("plantList").innerHTML=r.map(x=>`
<div class="item">
<h3>🌿 ${esc(x.name)}</h3>
<div class="latin">${esc(x.latin)}</div>
<p>
<span class="badge">💡 ${esc(x.light)}</span>
<span class="badge">CO₂: ${esc(x.co2)}</span>
</p>
<div class="small">
Altura: ${esc(x.size)}<br>
Posición: ${esc(x.zone)}
</div>
</div>`).join("")||'<div class="empty">No se encontraron plantas.</div>';
}


/* =========================
   CREAR ACUARIO
========================= */

function createTank(){
const name=prompt("Nombre del acuario:");
if(!name)return;

const liters=Number(prompt("Volumen del acuario en litros:"))||0;

const t={
id:Date.now(),
name,
liters,
length:0,
width:0,
height:0,
photo:"",
fish:[],
plants:[],
measurements:[],
filter:{
type:"",
brand:"",
model:"",
flow:0,
sump:{length:0,width:0,height:0,liters:0},
materials:[]
}
};

tanks.push(t);
saveTanks();
renderTanks();
}

function deleteTank(id){
if(!confirm("¿Eliminar este acuario?"))return;
tanks=tanks.filter(x=>x.id!==id);
saveTanks();
renderTanks();
}

function editTank(id){
const t=tanks.find(x=>x.id===id);
if(!t)return;

const name=prompt("Nombre",t.name);
if(name!==null)t.name=name;

const liters=prompt("Volumen (L)",t.liters);
if(liters!==null)t.liters=Number(liters)||t.liters;

const l=prompt("Largo (cm)",t.length);
const w=prompt("Ancho (cm)",t.width);
const h=prompt("Alto (cm)",t.height);

if(l!==null)t.length=Number(l)||0;
if(w!==null)t.width=Number(w)||0;
if(h!==null)t.height=Number(h)||0;

saveTanks();
renderTanks();
}


/* =========================
   FOTO
========================= */

function savePhoto(id,input){
const t=tanks.find(x=>x.id===id);
if(!t||!input.files[0])return;

const file=input.files[0];

if(!file.type.startsWith("image/")){
alert("Selecciona una imagen válida.");
return;
}

const reader=new FileReader();

reader.onload=e=>{
t.photo=e.target.result;
saveTanks();
renderTanks();
};

reader.readAsDataURL(file);
}

function removePhoto(id){
const t=tanks.find(x=>x.id===id);
if(!t)return;
t.photo="";
saveTanks();
renderTanks();
}


/* =========================
   PECES Y PLANTAS
========================= */

function addFish(id){
const t=tanks.find(x=>x.id===id);
if(!t)return;

const name=document.getElementById("fish_"+id).value;
if(!name)return alert("Selecciona un pez.");

const qty=Number(document.getElementById("fishQty_"+id).value)||1;

const old=t.fish.find(x=>x.name===name);

if(old)old.quantity+=qty;
else{
const f=fish.find(x=>x.name===name);
t.fish.push({name:f.name,latin:f.latin,quantity:qty});
}

saveTanks();
renderTanks();
}

function removeFish(id,name){
const t=tanks.find(x=>x.id===id);
t.fish=t.fish.filter(x=>x.name!==name);
saveTanks();
renderTanks();
}

function addPlant(id){
const t=tanks.find(x=>x.id===id);
if(!t)return;

const name=document.getElementById("plant_"+id).value;
if(!name)return alert("Selecciona una planta.");

const qty=Number(document.getElementById("plantQty_"+id).value)||1;

const old=t.plants.find(x=>x.name===name);

if(old)old.quantity+=qty;
else{
const p=plants.find(x=>x.name===name);
t.plants.push({name:p.name,latin:p.latin,quantity:qty});
}

saveTanks();
renderTanks();
}

function removePlant(id,name){
const t=tanks.find(x=>x.id===id);
t.plants=t.plants.filter(x=>x.name!==name);
saveTanks();
renderTanks();
}


/* =========================
   MEDICIONES
========================= */

function saveMeasurement(id){
const t=tanks.find(x=>x.id===id);

const ph=document.getElementById("ph_"+id).value;
const gh=document.getElementById("gh_"+id).value;
const kh=document.getElementById("kh_"+id).value;
const temp=document.getElementById("temp_"+id).value;

if(!ph&&!gh&&!kh&&!temp){
alert("Introduce al menos una medición.");
return;
}

t.measurements.unshift({
id:Date.now(),
date:new Date().toLocaleDateString("es-ES"),
ph,gh,kh,temp
});

t.measurements=t.measurements.slice(0,30);

saveTanks();
renderTanks();
}

function deleteMeasurement(id,mid){
const t=tanks.find(x=>x.id===id);
t.measurements=t.measurements.filter(x=>x.id!==mid);
saveTanks();
renderTanks();
}


/* =========================
   FILTRACIÓN
========================= */

function saveFilter(id){
const t=tanks.find(x=>x.id===id);
const f=t.filter;

f.type=document.getElementById("filterType_"+id)?.value||"";
f.brand=document.getElementById("filterBrand_"+id)?.value||"";
f.model=document.getElementById("filterModel_"+id)?.value||"";
f.flow=Number(document.getElementById("filterFlow_"+id)?.value)||0;

if(f.type==="Sump"){
f.sump.length=Number(document.getElementById("sumpL_"+id)?.value)||0;
f.sump.width=Number(document.getElementById("sumpW_"+id)?.value)||0;
f.sump.height=Number(document.getElementById("sumpH_"+id)?.value)||0;

f.sump.liters=Number(
(f.sump.length*f.sump.width*f.sump.height/1000).toFixed(1)
);
}

saveTanks();
renderTanks();
}

function addMaterial(id){
const t=tanks.find(x=>x.id===id);

const type=document.getElementById("matType_"+id).value.trim();
const brand=document.getElementById("matBrand_"+id).value.trim();
const liters=Number(document.getElementById("matLiters_"+id).value)||0;
const kind=document.getElementById("matKind_"+id).value;

if(!type){
alert("Introduce el material filtrante.");
return;
}

t.filter.materials.push({
id:Date.now(),
type,
brand,
liters,
kind
});

saveTanks();
renderTanks();
}

function deleteMaterial(id,mid){
const t=tanks.find(x=>x.id===id);
t.filter.materials=t.filter.materials.filter(x=>x.id!==mid);
saveTanks();
renderTanks();
}


/* =========================
   GRÁFICA
========================= */

function chart(t){
if(!t.measurements.length)
return '<div class="chart-empty">📈 Guarda varias mediciones para ver la evolución.</div>';

const rows=[...t.measurements].reverse();

const W=760,H=260,L=50,R=15,T=20,B=35;
const pw=W-L-R;
const ph=H-T-B;

function x(i){
